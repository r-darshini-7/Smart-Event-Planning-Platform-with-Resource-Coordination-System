{% extends 'base.html' %}
{% block title %}Delete Budget Item{% endblock %}
{% block content %}
<div class="page-header"><h2>Delete Budget Item</h2></div>
<div class="card"><div class="card-body">
  <p>Delete <strong>{{ item.description }}</strong>?</p>
  <form method="post">{% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'budget_list' %}" class="btn-cancel ms-2">Cancel</a>
  </form>
</div></div>
{% endblock %}
