{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><h2>{{ title }}</h2></div>
<div class="card"><div class="card-body">
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {% for field in form %}
    <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>
    {% endfor %}
    <button type="submit" class="btn-submit">Save</button>
    <a href="{% url 'sponsor_list' %}" class="btn-cancel ms-2">Cancel</a>
  </form>
</div></div>
{% endblock %}
