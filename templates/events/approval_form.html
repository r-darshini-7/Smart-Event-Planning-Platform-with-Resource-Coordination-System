{% extends 'base.html' %}
{% block title %}New Approval Request{% endblock %}
{% block content %}
<div class="page-header"><h2>Submit Approval Request</h2></div>
<div class="card"><div class="card-body">
  <form method="post">{% csrf_token %}
    {% for field in form %}
    <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>
    {% endfor %}
    <button type="submit" class="btn-submit">Submit Request</button>
    <a href="{% url 'approval_list' %}" class="btn-cancel ms-2">Cancel</a>
  </form>
</div></div>
{% endblock %}
