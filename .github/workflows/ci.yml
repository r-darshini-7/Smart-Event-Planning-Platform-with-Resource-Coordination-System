name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DJANGO_SETTINGS_MODULE: event_management.settings
  PYTHONPATH: .

jobs:
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations (check)
        run: python manage.py migrate --run-syncdb

      - name: Run system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test events --verbosity 2

  # ─────────────────────────────────────────
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 events/ --max-line-length=120 --exclude=migrations --count --statistics

  # ─────────────────────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t event-management:${{ github.sha }} .

      - name: Test Docker image starts
        run: |
          docker run -d --name em_test -p 8000:8000 \
            -e DJANGO_SETTINGS_MODULE=event_management.settings \
            event-management:${{ github.sha }}
          sleep 5
          docker logs em_test
          docker stop em_test

  # ─────────────────────────────────────────
  deploy:
    name: Deploy (main only)
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        # Set these secrets in GitHub: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/event_management
            git pull origin main
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn
