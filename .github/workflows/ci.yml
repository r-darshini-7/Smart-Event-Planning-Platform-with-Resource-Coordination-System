name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DJANGO_SETTINGS_MODULE: settings
  PYTHONPATH: .

jobs:
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/
      MONGODB_DB: event_management

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MongoDB
        run: |
          python - <<'PY'
          import socket
          import time
          from pymongo import MongoClient

          host = "127.0.0.1"
          port = 27017
          max_attempts = 60

          for attempt in range(max_attempts):
            try:
              with socket.create_connection((host, port), timeout=2):
                pass
              with MongoClient(
                f"mongodb://{host}:{port}/",
                serverSelectionTimeoutMS=2000,
                connectTimeoutMS=2000,
              ) as client:
                client.admin.command("ping")
              print(f"MongoDB is ready (attempt {attempt + 1}/{max_attempts})")
              break
            except Exception as exc:
              print(f"MongoDB is not ready (attempt {attempt + 1}/{max_attempts}): {exc}")
              time.sleep(1)
          else:
            raise SystemExit("MongoDB did not become ready within 60 seconds")
          PY

      - name: Run database migrations
        run: python manage.py migrate

      - name: Run system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test events --verbosity 2

  # ─────────────────────────────────────────
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 events/ --max-line-length=120 --exclude=migrations --count --statistics --exit-zero

