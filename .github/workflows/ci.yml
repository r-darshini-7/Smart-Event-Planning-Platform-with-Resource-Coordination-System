name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DJANGO_SETTINGS_MODULE: settings
  PYTHONPATH: .

jobs:
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/
      MONGODB_DB: event_management

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MongoDB
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          for attempt in range(30):
              try:
                  MongoClient(
                      "mongodb://127.0.0.1:27017/",
                      serverSelectionTimeoutMS=1000,
                  ).admin.command("ping")
                  print("MongoDB is ready")
                  break
              except Exception as exc:
                  print(f"MongoDB is not ready (attempt {attempt + 1}/30): {exc}")
                  time.sleep(2)
          else:
              raise SystemExit("MongoDB did not become ready within 60 seconds")

      - name: Run database migrations
        run: python manage.py migrate

      - name: Run system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test events --verbosity 2

  # ─────────────────────────────────────────
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 events/ --max-line-length=120 --exclude=migrations --count --statistics --exit-zero

